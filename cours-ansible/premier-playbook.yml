# deploy.yml
---
- name: Déploiement complet de l'infrastructure Cloud-1
  hosts: all
  become: true # Droits sudo pour les paquets, firewall et docker

  roles:
    # 1. Sécurité réseau
    - role: roles/ufw

    # 2. Moteur de conteneurs
    - role: roles/docker

    # 3. Déploiement applicatif WordPress / MariaDB / Nginx
    - role: roles/inception
      become: false # Inception se lance avec l'utilisateur normal (ubuntu)