---
# 1. Dépendances nécessaires pour ajouter le repo Docker officiel
- name: Installer les paquets prérequis (apt-transport-https, curl, ca-certificates)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  become: true

# 2. Créer le dossier pour la clé GPG
- name: Créer le dossier pour les clés de signature
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

# 3. Télécharger la clé GPG officielle de Docker
- name: Télécharger la clé GPG Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true

# 4. Ajouter le dépôt officiel Docker aux sources APT
- name: Ajouter le dépôt officiel Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  become: true

# 5. Installer Docker Engine et le plugin Docker Compose
- name: Installer Docker et le plugin Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  become: true

# 6. S'assurer que le service Docker tourne et s'active au boot
- name: Démarrer et activer le service Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes
  become: true

# 7. Ajouter l'utilisateur ubuntu au groupe 'docker' (évite d'utiliser sudo)
- name: Ajouter l'utilisateur ubuntu au groupe docker
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: yes
  become: true

# 8. Réinitialiser la session SSH Ansible pour prendre en compte le nouveau groupe
- name: Réinitialiser la connexion SSH
  ansible.builtin.meta: reset_connection