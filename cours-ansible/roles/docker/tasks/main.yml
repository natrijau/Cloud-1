---
# 1. Prérequis
- name: Installer les dépendances
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  become: true

# 2. Clé GPG Docker
- name: Créer le dossier pour les clés GPG
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Télécharger la clé GPG officielle
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true

# 3. Dépôt officiel
- name: Ajouter le dépôt Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  become: true

# 4. Installation des paquets (avec le module Python requis par Ansible)
- name: Installer Docker Engine, Compose et les dépendances Python
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    state: present
    update_cache: yes
  become: true

# 5. Démarrage initial
- name: Activer et démarrer Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes
  become: true

# 6. Configuration daemon (avec handler)
- name: Déployer la configuration du daemon Docker
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart Docker

# 7. Droits utilisateur & rafraîchissement des permissions
- name: Ajouter l'utilisateur ubuntu au groupe docker
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: yes
  become: true

- name: Réinitialiser la session SSH
  ansible.builtin.meta: reset_connection